<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveDock Redirect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
    </style>
</head>
<body>

    <h2>Переход в приложение DriveDock...</h2>
    <p>Если приложение не открылось автоматически, нажмите кнопку ниже:</p>
    
    <a id="appBtn" href="#" class="btn">Открыть DriveDock</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const telegramId = urlParams.get('telegram_id');

        if (telegramId) {
            const deepLink = "drivedock://auth?telegram_id=" + telegramId;
            
            // Настраиваем кнопку для ручного клика
            document.getElementById('appBtn').href = deepLink;

            // Пробуем автоматический редирект
            setTimeout(() => {
                window.location.href = deepLink;
            }, 300);
        } else {
            document.querySelector('h2').innerText = "Ошибка: Telegram ID не найден";
        }
    </script>
</body>
</html>
